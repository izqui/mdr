name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm test
      - run: python3 scripts/test-feedback-cli.py
      - run: npx playwright install chromium webkit
      - run: npm run test:ui
      - run: npm run test:selection
      - name: Native WebKit, PDF, file links, and live feedback
        run: |
          MDR_INTEGRATION_TEST_DIR="$PWD/work/qa/native" .build/debug/mdr
          MDR_LINK_TEST_DIR="$PWD/work/qa/links" .build/debug/mdr
          MDR_LIVE_TEST_DIR="$PWD/work/qa/live" .build/debug/mdr
          MDR_FOLDER_TEST_DIR="$PWD/work/qa/folders" .build/debug/mdr
      - run: npm run build
      - run: python3 scripts/test-distribution.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            work/qa/
          retention-days: 7
